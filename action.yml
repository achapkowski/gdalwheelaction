name: Dependency License Check
description: Install a Python package and verify license metadata for all newly installed dependencies.

inputs:
  package:
    description: Package specifier or local path to install with pip before checking dependency licenses.
    required: true
  python-version:
    description: Python version used to install the package and inspect dependency metadata.
    required: false
    default: "3.11"
  fail-on-missing-license:
    description: Fail when any installed dependency does not expose license metadata.
    required: false
    default: "true"
  allowed-licenses:
    description: Comma-separated or newline-separated list of allowed license names.
    required: false
    default: ""
  disallowed-licenses:
    description: Comma-separated or newline-separated list of blocked license names.
    required: false
    default: ""
  report-path:
    description: Path to the JSON report generated by the action.
    required: false
    default: dependency-license-report.json

outputs:
  dependency-count:
    description: Number of newly installed distributions that were inspected.
    value: ${{ steps.check.outputs.dependency-count }}
  failed:
    description: Whether any dependency violated the configured license policy.
    value: ${{ steps.check.outputs.failed }}
  report-path:
    description: Path to the generated dependency license report.
    value: ${{ steps.check.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Capture baseline environment
      shell: bash
      run: |
        python - <<'PY' > "$RUNNER_TEMP/dependency-license-baseline.txt"
        import importlib.metadata as metadata
        import re

        def normalize_name(value: str) -> str:
            return re.sub(r"[-_.]+", "-", value).lower()

        for distribution in metadata.distributions():
            name = distribution.metadata.get("Name") or distribution.name or ""
            if name:
                print(normalize_name(name))
        PY

    - name: Install package
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ inputs.package }}"

    - name: Check dependency licenses
      id: check
      shell: bash
      env:
        INPUT_ALLOWED_LICENSES: ${{ inputs.allowed-licenses }}
        INPUT_DISALLOWED_LICENSES: ${{ inputs.disallowed-licenses }}
        INPUT_FAIL_ON_MISSING_LICENSE: ${{ inputs.fail-on-missing-license }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        python "${{ github.action_path }}/scripts/check_dependency_licenses.py" \
          --baseline "$RUNNER_TEMP/dependency-license-baseline.txt" \
          --report-path "$INPUT_REPORT_PATH" \
          --fail-on-missing-license "$INPUT_FAIL_ON_MISSING_LICENSE" \
          --allowed-licenses "$INPUT_ALLOWED_LICENSES" \
          --disallowed-licenses "$INPUT_DISALLOWED_LICENSES"
