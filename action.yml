name: Dependency License Check
description: Check dependency license metadata for Python, Rust, and JavaScript repositories.

inputs:
  path:
    description: Repository subdirectory that contains the package manifest to inspect.
    required: false
    default: .
  ecosystem:
    description: Ecosystem to inspect. Use auto to detect python, rust, or javascript from the repository contents.
    required: false
    default: auto
  python-version:
    description: Python version used to run the action and inspect Python dependencies.
    required: false
    default: "3.11"
  node-version:
    description: Node.js version used when inspecting JavaScript dependencies.
    required: false
    default: "20"
  fail-on-missing-license:
    description: Fail when any installed dependency does not expose license metadata.
    required: false
    default: "true"
  allowed-licenses:
    description: Comma-separated or newline-separated list of allowed license names.
    required: false
    default: ""
  disallowed-licenses:
    description: Comma-separated or newline-separated list of blocked license names.
    required: false
    default: ""
  report-path:
    description: Path to the JSON report generated by the action.
    required: false
    default: dependency-license-report.json

outputs:
  ecosystem:
    description: Ecosystem that was detected or selected for the check.
    value: ${{ steps.check.outputs.ecosystem }}
  dependency-count:
    description: Number of dependencies that were inspected.
    value: ${{ steps.check.outputs.dependency-count }}
  failed:
    description: Whether any dependency violated the configured license policy.
    value: ${{ steps.check.outputs.failed }}
  report-path:
    description: Path to the generated dependency license report.
    value: ${{ steps.check.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Check dependency licenses
      id: check
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
        INPUT_ALLOWED_LICENSES: ${{ inputs.allowed-licenses }}
        INPUT_DISALLOWED_LICENSES: ${{ inputs.disallowed-licenses }}
        INPUT_FAIL_ON_MISSING_LICENSE: ${{ inputs.fail-on-missing-license }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        python "${{ github.action_path }}/scripts/check_dependency_licenses.py" \
          --path "$INPUT_PATH" \
          --ecosystem "$INPUT_ECOSYSTEM" \
          --report-path "$INPUT_REPORT_PATH" \
          --fail-on-missing-license "$INPUT_FAIL_ON_MISSING_LICENSE" \
          --allowed-licenses "$INPUT_ALLOWED_LICENSES" \
          --disallowed-licenses "$INPUT_DISALLOWED_LICENSES"
